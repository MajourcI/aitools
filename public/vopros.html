<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вопросы по тексту · Textify AI</title>
<meta name="description" content="Бесплатный AI-помощник на русском: вставь текст и задай вопрос — ИИ ответит строго по нему. Без регистрации.">
<link rel="canonical" href="https://majourci.online/vopros">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta property="og:title" content="Вопросы по тексту · Textify AI">
<meta property="og:description" content="Задай вопрос по своему тексту — ИИ ответит строго по нему. Бесплатно.">
<meta property="og:url" content="https://majourci.online/vopros">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/study.css">
<style>
.cross{margin-top:60px;padding-top:26px;border-top:1px solid var(--card-border)}
.cross-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);font-weight:700;margin-bottom:14px}
.cross-links{display:flex;flex-wrap:wrap;gap:10px}
.cross-links a{font-size:14px;color:var(--text2);background:var(--card);border:1px solid var(--card-border);padding:8px 15px;border-radius:99px;transition:.2s}
.cross-links a:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="brand" href="/">Textify AI</a><a class="back" href="/">← На главную</a></div>
  <h1>Вопросы по тексту</h1>
  <p class="sub">Вставь текст (конспект, главу, статью) и задай вопрос — ИИ ответит строго по нему. Бесплатно · Без регистрации</p>

  <label>Текст</label>
  <textarea id="text" placeholder="Вставь текст, по которому хочешь задать вопрос..."></textarea>
  <label>Вопрос</label>
  <input id="question" placeholder="Например: в чём главная мысль третьего абзаца?">

  <button class="btn" id="go" onclick="run()">Получить ответ</button>
  <div class="err" id="err"></div>
  <div class="result" id="result"></div>
  <div class="result-actions" id="actions" style="display:none">
    <button class="mini" onclick="copyRes()">Копировать</button>
  </div>

  <footer class="cross">
    <div class="cross-title">Другие инструменты</div>
    <div class="cross-links">
      <a href="/gumanajzer">Гуманайзер текста</a>
      <a href="/restyle">Рерайт под стиль</a>
      <a href="/sokrat">Сократить текст</a>
      <a href="/rezyume">Улучшить резюме</a>
      <a href="/idei">Идеи для контента</a>
      <a href="/generator">Генератор текста</a>
      <a href="/chat">Чат с ИИ</a>
    </div>
  </footer>
</div>
<script>
async function run(){
  const text=document.getElementById('text').value.trim();
  const question=document.getElementById('question').value.trim();
  const err=document.getElementById('err'),res=document.getElementById('result'),btn=document.getElementById('go'),act=document.getElementById('actions');
  err.textContent='';
  if(!text){err.textContent='Вставь текст';return;}
  if(!question){err.textContent='Задай вопрос';return;}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Думаю...';res.classList.remove('show');act.style.display='none';
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,question})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Ошибка');
    res.textContent=d.result||'Пустой результат';res.classList.add('show');act.style.display='flex';
  }catch(e){err.textContent=e.message;}
  btn.disabled=false;btn.textContent='Получить ответ';
}
function copyRes(){navigator.clipboard.writeText(document.getElementById('result').textContent);}
</script>
</body>
</html>
